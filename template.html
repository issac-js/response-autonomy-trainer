textarea,audio{max-width:100%}.tablelike>div,.split>span{min-width:0;overflow-wrap:anywhere}.tablelike button{flex-shrink:0}.quote-reply{white-space:pre-wrap;overflow-wrap:anywhere}:focus-visible{outline:3px solid #9e81ce;outline-offset:3px}.coach-trigger{display:block;margin-top:12px}.coach-check{display:block;margin:12px 0}.coach-check select{margin-top:6px}.coach-pending{overflow-wrap:anywhere}.panel label+textarea,.panel label+select{margin-bottom:12px}.tablelike>span{min-width:0;overflow-wrap:anywhere}.tablelike>span:last-child{flex-shrink:0}audio{width:100%}.model-quote{color:#6a46b8;font-weight:700;font-size:1.02em;line-height:1.6}.ai-model{margin-top:6px}@media(prefers-color-scheme:dark){.model-quote{color:#c3aaff}}.ai-block{border-left:4px solid var(--border);padding:10px 12px;margin:10px 0;background:var(--pale);border-radius:10px}.ai-block b{display:block;font-size:12px;letter-spacing:.06em;margin-bottom:3px}.ai-block p{margin:0;line-height:1.6}.ai-block strong{font-weight:800}.ai-block.fact{border-color:#6b8cff}.ai-block.fact b{color:#4f6ee0}.ai-block.boundary{border-color:#d9a441}.ai-block.boundary b{color:#a97b1c}.ai-block.length{border-color:#3fae9a}.ai-block.length b{color:#237e6e}.ai-block.rewrite{border-color:#8b6bd6}.ai-block.rewrite b{color:#6a46b8}.ai-block.tip{border-color:#b08b3e;border-left-style:dashed;background:transparent}@media(prefers-color-scheme:dark){.ai-block.fact b{color:#9db0ff}.ai-block.boundary b{color:#e6c37a}.ai-block.length b{color:#7fd8c8}.ai-block.rewrite b{color:#c3aaff}}.selfrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}.segwrap{display:flex;flex-wrap:wrap;gap:8px}.seg{background:var(--surface);color:inherit;border:1px solid var(--border);border-radius:999px;padding:10px 14px;font-weight:600}.seg.on{background:var(--purple);border-color:var(--purple);color:#fff}html{-webkit-text-size-adjust:100%;text-size-adjust:100%}body{min-height:100dvh;-webkit-tap-highlight-color:rgba(83,53,154,.12)}button,select,textarea,input{font-size:16px}button,.tab,.option,summary{min-height:44px;touch-action:manipulation}summary{padding:6px 0}.app{padding:calc(22px + env(safe-area-inset-top)) calc(17px + env(safe-area-inset-right)) calc(75px + env(safe-area-inset-bottom)) calc(17px + env(safe-area-inset-left))}@media(max-width:610px){.app{padding:calc(12px + env(safe-area-inset-top)) calc(11px + env(safe-area-inset-right)) calc(65px + env(safe-area-inset-bottom)) calc(11px + env(safe-area-inset-left))}}/*MOBILE_CSS*/</style></head><body><main class="app"><header class="hero"><h1>回应自主权 · 情境决策训练</h1><p>识别问题 → 自主回应 → 多轮变化 → 反馈复盘 → 间隔巩固</p></header><nav class="nav" aria-label="主要导航"><button class="tab" data-nav="home">今日训练</button><button class="tab" data-nav="coach">自主回应练习</button><button class="tab" data-nav="quick">快速刷题</button><button class="tab" data-nav="communication">沟通方法</button><button class="tab" data-nav="bank">卡片库</button><button class="tab" data-nav="dialogue">多轮模拟</button><button class="tab" data-nav="stats">复盘统计</button><button class="tab" data-nav="settings">设置与备份</button></nav><div id="unsavedNotice" class="notice" hidden><details class="draft-info"><summary>有未提交草稿 · 点击查看</summary><span id="unsavedStatus">草稿已在本标签页临时保留，未写入学习记录或备份。关闭标签页后可能丢失；可在设置中选择额外保留卡片练习进度。</span></span> <button type="button" class="ghost" id="unsavedClear">清除临时草稿</button></details></div><div id="practiceBar" hidden><button class="ghost" id="practiceBack">暂存进度并返回</button><span id="practiceStep"></span></div><p id="practiceStatus" role="status"></p><div id="root"></div><p class="foot">离线本地练习 · 不诊断他人动机 · 不替代专业安全处置与正式工作流程 · v0.14.0</p></main><script id="bank" type="application/json">[{"id":"RA-001","group":"回应自主权","signal":"礼貌压力","scene":"同事闲聊；不涉及工作职责","question":"你周末到底跟谁一起出去的？","options":["如实列出所有同行者，免得尴尬","你问这个有什么事吗？我更想保留私人安排。","反问他是不是在监视你","编造一个无关的人名"],"correct":1,"rationale":"私人行程不因被问到就必须交代。先问目的或直接温和设界限均可，不必猜测恶意。","model":"“只是私人安排，我就不展开了。你问这个有什么事吗？”","principle":"被问到≠必须披露"},{"id":"RA-002","group":"回应自主权","signal":"沉默耐受","scene":"茶水间；刚聊完工作","question":"你怎么不说话？是不是有意见？","options":["赶紧解释半天自己没有意见","如果没有意见，就简短说明并停止；不需要填满沉默","立刻离开并怒视对方","捏造一个意见来回应"],"correct":1,"rationale":"沉默不是违约，也不需要用长篇证明自己正常。若存在真实工作分歧，应如实、适当地提出。","model":"“没有新的意见，我在听大家讨论。”","principle":"不用靠过度解释消除尴尬"},{"id":"RA-003","group":"回应自主权","signal":"回应选择","scene":"朋友问一个普通、不敏感的问题","question":"你最近在看哪本书？","options":["要求对方先解释为什么收集你的阅读信息","能聊就直接简短回答","保持沉默以维护边界","反问其是否有目的"],"correct":1,"rationale":"非敏感闲聊通常可以自然回答；训练目标是自主，而不是见问必防。","model":"“最近在看一本关于沟通的书，你呢？”","principle":"正常问题可正常回答"},{"id":"RA-004","group":"回应自主权","signal":"避免自证","scene":"同事轻率评价，但没有具体事件","question":"你是不是特别爱表现自己？","options":["列举过去几年所有低调行为","你有什么证据？你在污蔑我！","如果涉及具体行为，可以讨论具体事；不必证明完整人格","认下标签，尽快结束"],"correct":2,"rationale":"抽象人格标签没有可直接检验的定义。将讨论对象从人格转为具体事件。","model":"“如果有哪件具体事情让你有这种感觉，我们可以讨论那件事。”","principle":"讨论行为，不自证人格"},{"id":"RA-005","group":"回应自主权","signal":"直接拒绝","scene":"有人要求你在私人时间透露他人的隐私","question":"你把他手机号发给我，就一下。","options":["发过去，省得麻烦","编造一个错误号码","未经本人同意不能转交，可以建议对方直接联系","反问对方是否是坏人"],"correct":2,"rationale":"涉及第三方个人信息；拒绝并提供合适替代渠道。","model":"“我不能未经同意分享他的号码，你可以通过公开渠道联系或请我转达。”","principle":"他人隐私不是你的可支配信息"},{"id":"RA-006","group":"预设前提","signal":"标签化","scene":"无具体事件的随意提问","question":"你一直都不肯配合团队，对吧？","options":["立刻证明自己每次都配合","先澄清具体事件，不接受“一直”的泛化","默认承认“对”","回击你才不配合"],"correct":1,"rationale":"“一直”是概括性预设；先要求具体行为，避免人格层面自证。","model":"“你说的是哪次合作？我们讨论具体过程更准确。”","principle":"把概括还原为事实"},{"id":"RA-007","group":"预设前提","signal":"隐藏假设","scene":"同事询问未经核实的事情","question":"你为什么又把消息泄露出去了？","options":["解释自己为什么再次泄露","否认并详细交代每次聊天记录","先指出泄露和“又”的前提尚未成立","转而指控别人泄露"],"correct":2,"rationale":"这个为什么式问题已经将“你泄露了”当作事实。先修正前提。","model":"“我不同意‘我泄露了消息’这个前提。你具体指哪条消息、依据是什么？”","principle":"先拆前提再回答为什么"},{"id":"RA-008","group":"预设前提","signal":"不实归因","scene":"朋友突然问","question":"你是不是因为嫉妒他，才不同意这个计划？","options":["辩论自己一辈子没有嫉妒过","说是，以免僵局","回到计划的具体意见和理由，不接受动机归因","立即攻击提问者"],"correct":2,"rationale":"“嫉妒”是对动机的推断，不等于事实。可讨论可验证的决策理由。","model":"“不是这个原因。我对计划的顾虑是成本和时间安排。”","principle":"拒绝被强加动机"},{"id":"RA-009","group":"预设前提","signal":"二选一陷阱","scene":"讨论项目延期","question":"你是能力不行，还是根本不想负责？","options":["从两项指控中选一项","说明二选一不成立，回到影响进度的事实","拿别人的能力说事","长篇证明自己很努力"],"correct":1,"rationale":"虚假二分会隐藏其他可能原因。先说明两项都非既定事实。","model":"“这两个选项都不准确。我们先核对延期原因和我负责的部分。”","principle":"不接受虚假二选一"},{"id":"RA-010","group":"预设前提","signal":"真实问题","scene":"主管基于已确认记录问","question":"系统显示这项任务昨天到期但尚未完成，预计何时交付？","options":["先说这是在给你设陷阱","在核实记录后直接说明进度、障碍和预计时间","保持沉默","要求领导解释为什么问"],"correct":1,"rationale":"有事实依据的职责问题，应主动、真实、准确回应，而不是机械反套话。","model":"“进度是80%，还差最终测试；预计明天下午交付。如果有变化我会提前说明。”","principle":"工作职责优先如实沟通"},{"id":"RA-011","group":"突然转题","signal":"不明目的","scene":"讨论排班时对方突然问","question":"对了，你跟某位领导私下熟不熟？","options":["详细回忆所有私人往来","直接询问与当前工作有什么关系","反控对方在套话","谎称完全不认识"],"correct":1,"rationale":"突兀但动机未知。先询问工作关联与具体需求。","model":"“怎么突然问这个？是有哪项工作需要我协助联系吗？”","principle":"先问目的，不先交代"},{"id":"RA-012","group":"突然转题","signal":"无下文","scene":"对方突然问完个人收入后沉默","question":"你一个月到底赚多少？","options":["为了不冷场继续介绍奖金与家庭收入","可礼貌表示不方便谈，不替对方续话","猜测他要借钱并指责","随意报一个假数字"],"correct":1,"rationale":"对方沉默不构成你继续披露的义务；可以自然转回原话题。","model":"“这个我不太想聊。刚才我们说到的安排继续吧。”","principle":"沉默不是补充解释的指令"},{"id":"RA-013","group":"突然转题","signal":"合理闲聊","scene":"午休时同事突然问","question":"你最近有没有去过那家新咖啡店？","options":["先审查提问动机","想聊就正常简短回应","拒绝回答以建立权威","展开所有上月行程"],"correct":1,"rationale":"无敏感内容且没有额外风险，可正常社交，不需要处处设防。","model":"“还没去过，听说不错。你去过吗？”","principle":"避免把所有跳题视为套话"},{"id":"RA-014","group":"突然转题","signal":"会议跑题","scene":"业务会议突然进入私人评价","question":"先不说项目，你觉得某位同事为人怎么样？","options":["给出私人评价和流言","把讨论拉回与决策相关的工作事实","假装没听到问题","用激烈措辞评价提问者"],"correct":1,"rationale":"对人的概括评价易偏离业务目标；必要时只讨论可核验的工作表现。","model":"“如果是项目协作方面，我可以谈具体事实；私人评价就不展开了。”","principle":"只交换相关且有依据的信息"},{"id":"RA-015","group":"突然转题","signal":"不急求因","scene":"对方问一句后不解释原因","question":"你是不是已经准备离职了？","options":["迫不及待说明职业规划所有细节","平静设置个人边界，也可问其所关心的工作问题","追问十分钟逼他说真实目的","按他暗示承认"],"correct":1,"rationale":"即便问题无下文，也不必用推测来补全对方的目的。","model":"“这是个人规划，我暂时不讨论。工作安排上有具体需要确认的吗？”","principle":"不为缺席的解释负责"},{"id":"RA-016","group":"隐私与披露","signal":"第三方信息","scene":"有人以熟人身份打听","question":"那位学生的具体病情你知道吧，告诉我一下？","options":["只要认识就可告诉","用匿名但可识别的细节说明","不披露他人健康信息，提供正式咨询渠道","编造病情"],"correct":2,"rationale":"健康信息高度敏感；角色职责和授权必须被核实，普通熟人关系不足以授权披露。","model":"“涉及个人隐私，我不能讨论。若有正式需要，请通过授权渠道咨询。”","principle":"第三方敏感信息从严保护"},{"id":"RA-017","group":"隐私与披露","signal":"家庭隐私","scene":"普通同事询问","question":"你家里最近是不是出了什么事？","options":["所有家庭细节如实交代","感谢关心并自行决定披露程度","反问他为什么窥探","编造家庭变故"],"correct":1,"rationale":"关心可能是善意，也可能只是好奇，关键是你的信息选择权。","model":"“谢谢关心，目前我能处理好，暂时不想细说。”","principle":"关心不等于信息授权"},{"id":"RA-018","group":"隐私与披露","signal":"账号权限","scene":"同事说为了方便处理事务","question":"把你系统登录密码发我一下，我帮你查。","options":["直接发给他","共享一次性登录码即可","拒绝共享凭据，建议使用合规代办或权限申请","随便编密码"],"correct":2,"rationale":"账号、验证码和口令不应通过人际压力共享，即使对方看起来善意。","model":"“密码和验证码不能共享。我们可以通过正式授权流程处理。”","principle":"保密边界不因关系改变"},{"id":"RA-019","group":"隐私与披露","signal":"公开信息","scene":"活动协作时对方问","question":"学校官网上那份公开的活动日程在哪？","options":["拒绝提供以维护边界","直接提供已公开、核实的链接","要求对方先报姓名","猜一个日期"],"correct":1,"rationale":"公开且已确认的信息通常应直接协助；区别个人隐私和公共资料。","model":"“我把官网的公开日程链接发给你。”","principle":"不能把防守变成不合作"},{"id":"RA-020","group":"隐私与披露","signal":"不得编造","scene":"朋友问你不愿回答的问题","question":"你银行卡里现在有多少存款？","options":["编一个数字让对方死心","诚实设界限，无需造假","反复解释全部资产结构","讽刺对方没钱"],"correct":1,"rationale":"不想回答完全可以直接说，不必以虚假信息代替边界。","model":"“具体存款我不讨论，还是聊点别的吧。”","principle":"拒答比撒谎更稳妥"},{"id":"RA-021","group":"诱导站队","signal":"带风向","scene":"同事对另一个人评价","question":"你也觉得他办事特别不靠谱吗？","options":["赞同以融入群体","仅就自己亲见的具体事项说话","把不靠谱重复得更严重","反问你是不是嫉妒他"],"correct":1,"rationale":"对方的形容词不是证据。避免被动卷入价值判断和流言。","model":"“我不了解全部情况；如果有具体协作问题，可以就事情讨论。”","principle":"不被诱导替别人背书"},{"id":"RA-022","group":"诱导站队","signal":"虚假共识","scene":"有人在会上说","question":"大家都认为这个方案很糟糕，你也这么想吧？","options":["默认大家都这么想","独立评价方案并说明自己掌握的依据","指责所有人都不专业","为了安全沉默到底"],"correct":1,"rationale":"“大家都”未经核实，不能代替独立判断。","model":"“我还没看到大家的具体反馈。就方案本身，我认为需要补充风险评估。”","principle":"群体暗示不是事实"},{"id":"RA-023","group":"诱导站队","signal":"背后评价","scene":"有人问","question":"你听说领导最近跟谁闹矛盾了吗？","options":["交流未经核实的传闻","不了解就说明不了解，不参与揣测","假装知道以保持面子","把自己的猜测说成事实"],"correct":1,"rationale":"不传播未经核实的信息，尤其涉及人际关系和声誉。","model":"“我不了解，也不适合根据传闻判断。”","principle":"不参与传言循环"},{"id":"RA-024","group":"诱导站队","signal":"真实立场","scene":"会议就已经公开讨论的方案问","question":"你是否支持这个新流程？理由是什么？","options":["只有沉默才能保住边界","基于工作事实表达立场、理由和保留条件","说对方在引导你","只回答随便吧"],"correct":1,"rationale":"对正式议题表达真实观点是正常职责，不是所有立场提问都是套话。","model":"“我原则上支持，但建议先试运行两周，重点看响应时间。”","principle":"边界与坦诚合作可以共存"},{"id":"RA-025","group":"诱导站队","signal":"暗示保证","scene":"对方问","question":"你肯定能保证这件事绝对不会出问题吧？","options":["立刻承诺绝对安全","说明可控范围和剩余风险，不作绝对保证","保证后再私下解释","以攻击性语气拒绝"],"correct":1,"rationale":"绝对化保证可能超出可控范围；明确风险与条件比迎合更可靠。","model":"“不能保证零风险。我可以说明已采取的措施、剩余风险和应急方案。”","principle":"不作超出证据的承诺"},{"id":"RA-026","group":"职责与安全","signal":"优先安全","scene":"学生说头晕胸闷并询问校医今天是否在岗","question":"我胸口很不舒服，校医今天开门吗？","options":["仅讨论校医排班","先识别紧急程度并引导立即寻求当地急救或现场援助","先问学生为何突然问","要求提供全部病史再行动"],"correct":1,"rationale":"胸部不适可能需要紧急评估；沟通边界不能延误潜在严重症状的安全措施。","model":"“你现在是否有明显胸痛、呼吸困难或快晕倒？如有请立即拨打当地急救电话并请求现场帮助，我也会按流程协助。”","principle":"安全风险优先于话术策略"},{"id":"RA-027","group":"职责与安全","signal":"授权边界","scene":"外部人员询问安全监控录像","question":"把昨晚某楼层监控视频发我看看。","options":["直接分享视频","核实身份、用途及授权，转正式流程","说监控都坏了","立即指责对方是坏人"],"correct":1,"rationale":"监控资料涉及隐私与授权，不能凭口头要求转交；但要告知合规处理路径。","model":"“这类视频需要按授权流程调取。请提供正式需求，我协助转交负责部门。”","principle":"涉及权限的信息要核验"},{"id":"RA-028","group":"职责与安全","signal":"明确任务","scene":"主管明确要求确认一项公共安排","question":"今天的值班表是否已经更新？","options":["先问为什么问","如实核查并明确回复状态","为保护自主权保持沉默","转移到其他话题"],"correct":1,"rationale":"合理、职责范围内的问题应该直接回答，必要时说明尚待确认。","model":"“已经更新到最新版本，下午四点生效。”","principle":"有问必答的问题确实存在"},{"id":"RA-029","group":"职责与安全","signal":"不代替制度","scene":"有人要求绕过程序","question":"你跟某部门熟，帮我不走流程直接拿资料吧？","options":["利用关系私下拿取","说明应走正式流程并可提供协助","假装同意却不处理","评价其人品"],"correct":1,"rationale":"关系不替代权限；既守制度又提供可执行的下一步。","model":"“涉及资料调取，需要按正式流程申请。我可以告诉你申请入口。”","principle":"善意协助不等于违规"},{"id":"RA-030","group":"职责与安全","signal":"未知不猜","scene":"学生问具体处理时间而你尚未核实","question":"你们今天几点能给我准确结果？","options":["为了安抚承诺半小时","明确目前未知并给出核实或反馈机制，不编造时间","直接沉默","讲十分钟内部流程"],"correct":1,"rationale":"不给未经确认的时间承诺；可以约定核实步骤并在有依据时给出时点。","model":"“目前我无法确认完成时间。我先向负责人员核实，确认后按约定渠道反馈。”","principle":"未知就标记未知"},{"id":"RA-031","group":"压力与追问","signal":"指责压力","scene":"对方在电话里说","question":"你们怎么这么不负责任？我已经说过好多次了！","options":["详细辩白个人工作态度","先关注具体问题与是否紧急，再核对记录","反骂对方不讲理","默认承担所有责任"],"correct":1,"rationale":"压力下先抓取可核查的事实和当前需求，不因指责而陷入人格自证。","model":"“我理解你着急。请告诉我具体事件和现在最紧急的需求，我立即核对。”","principle":"情绪不等于事实"},{"id":"RA-032","group":"压力与追问","signal":"连续逼问","scene":"同事连续说","question":"你不回答就是心虚吧？为什么不回答？","options":["马上泄露全部隐私来自证","平静重复边界，不接受沉默等于心虚的推断","说对方一定有阴谋","制造虚假借口"],"correct":1,"rationale":"拒绝回答私人问题并不逻辑等于心虚。重复边界即可，无需升级冲突。","model":"“是否回答私人问题是我的选择，这不代表你说的推断成立。”","principle":"边界可以重复，不必辩解"},{"id":"RA-033","group":"压力与追问","signal":"高压多问","scene":"会议中对方连珠炮似发问","question":"原因是什么？谁批准的？你有没有提前知道？","options":["任选一个随便回答","先归纳问题、逐项确认已知与未知","全部猜着答完","说你太烦了"],"correct":1,"rationale":"多问题同时输入会增加工作记忆负担。将其拆开有助于准确回答。","model":"“这里有三个问题。我先回答批准流程，其他两项需要核对记录。”","principle":"拆分问题，逐项回答"},{"id":"RA-034","group":"压力与追问","signal":"时间压力","scene":"对方催促","question":"你现在就给我一个保证，行不行？","options":["为了结束对话立刻保证","说明当前可确认的内容及不能承诺的部分","直接挂断","编造有领导批准"],"correct":1,"rationale":"时间压力不是超范围承诺的理由。","model":"“我可以确认目前已完成的步骤，但结果需要核实后才能承诺。”","principle":"不要用承诺换取暂时安静"},{"id":"RA-035","group":"压力与追问","signal":"真实错误","scene":"你确实遗漏了一项工作步骤，有记录可查","question":"这个检查是不是你没做？","options":["为了防套话拒绝承认","确认事实、承担自己部分并说明补救措施","归咎于对方提问方式","长篇证明自己其他方面都很好"],"correct":1,"rationale":"存在真实失误时应承担责任；训练不等于拒绝所有质询。","model":"“是的，这一步我遗漏了。我现在补做，并检查是否造成后续影响。”","principle":"自我主张与承担责任不冲突"},{"id":"RA-036","group":"倾听与修复","signal":"漏听信息","scene":"你没听清对方问题最后的时间条件","question":"明天上午…你们能安排吗？","options":["根据猜测直接回答可以","坦诚请其重复关键时段和需求","假装理解","改讲一般工作规定"],"correct":1,"rationale":"遗漏关键限定条件时主动修复，比猜测更专业。","model":"“抱歉，刚才时间条件我没听清。你是说明天上午几点、需要哪类安排？”","principle":"漏听就澄清"},{"id":"RA-037","group":"倾听与修复","signal":"提前构思","scene":"对方说很长背景，你脑中已准备答案但其仍在说","question":"“所以我想问的是……”","options":["立刻打断回答先前猜到的问题","继续听到具体请求，再简短复述","继续脑补后续","转换成自己的经历"],"correct":1,"rationale":"停止提前构思并回到对方完整问题。","model":"“我听明白了，你主要想确认下一步的负责部门，对吗？”","principle":"听完再答"},{"id":"RA-038","group":"倾听与修复","signal":"信息复杂","scene":"对方陈述事件涉及三个人和两个时间","question":"昨天A说B处理，今天C又说……","options":["立刻认定谁错了","用时间线复述已知事实并核对不一致点","把所有猜测一次说完","让对方不要说了"],"correct":1,"rationale":"复杂信息先结构化，避免工作记忆超载和归因错误。","model":"“我整理一下：昨天A通知由B处理，今天C给了不同说法，是这样吗？”","principle":"先结构化后判断"},{"id":"RA-039","group":"倾听与修复","signal":"简洁表达","scene":"对方只问一件可查事实","question":"今天会议是下午三点吗？","options":["说明会议如何筹备全过程","确认日程后直接回答","反问对方问这个干嘛","详细介绍每个参会人"],"correct":1,"rationale":"简单公开事实不需要复杂化。","model":"“是的，日程显示下午三点开始。”","principle":"答案长度匹配问题复杂度"},{"id":"RA-040","group":"倾听与修复","signal":"对方不回应","scene":"你澄清后，对方沉默","question":"你刚才问的具体是哪项工作？（对方没回应）","options":["连珠炮解释所有可能关联","允许沉默，必要时重申可协助的范围并结束","宣布对方有阴谋","追着对方逼出动机"],"correct":1,"rationale":"对方不回应，你可选择停顿，不必替他完成话题。","model":"“如果有具体工作需要帮助，告诉我就好。那我们先继续刚才的安排。”","principle":"不要自动填满沉默"},{"id":"RA-041","group":"正常交流与误判","signal":"善意关心","scene":"朋友问你是否很累","question":"你最近是不是压力很大？","options":["认定是在搜集你的弱点","按舒适程度回答，并可表达感谢","无条件交代私密心理细节","责备其多管闲事"],"correct":1,"rationale":"关心式提问不是默认陷阱；个人信息的多少由你决定。","model":"“最近有点忙，谢谢关心，暂时还好。”","principle":"警觉不等于敌意"},{"id":"RA-042","group":"正常交流与误判","signal":"开放询问","scene":"同事在复盘工作","question":"你觉得本次交接哪里还能改进？","options":["以为他在套你对团队的不满","提出具体、建设性的改进意见","拒绝回答任何意见","开始评价同事人格"],"correct":1,"rationale":"开放式工作复盘通常是合作机会，应该基于事实作答。","model":"“我建议统一交接清单，并在交班前确认未完成事项。”","principle":"分辨建设性问题"},{"id":"RA-043","group":"正常交流与误判","signal":"个人边界","scene":"陌生人在社交平台问","question":"你住在哪个小区、单元几号？","options":["详细回答以表示诚意","不提供精确住址，需要时只给适当范围","随意给假地址","长篇自责为什么不愿意说"],"correct":1,"rationale":"陌生人的精确住址询问通常不需要回答，界限清晰即可。","model":"“具体住址不方便提供。”","principle":"信息敏感度决定披露程度"},{"id":"RA-044","group":"正常交流与误判","signal":"有效质询","scene":"同事指出一处可核对的数据差异","question":"这个报表数字为什么和原始记录不一致？","options":["说在套话所以不理会","核实数字并解释差异或承认尚不清楚","绕到自己的辛苦付出","要求对方先证明没有偏见"],"correct":1,"rationale":"可核查的工作问题应认真处理，而非误判为心理战。","model":"“我先核对统计口径和原始数据，再给你准确原因。”","principle":"识别真实职责问题"},{"id":"RA-045","group":"正常交流与误判","signal":"关系修复","scene":"你之前回应过于生硬，朋友表达不舒服","question":"刚才你是不是有点生气？","options":["一律拒绝谈情绪","如实、适度说明感受并修复关系","长篇证明自己绝不会生气","反问对方有什么居心"],"correct":1,"rationale":"自主回应也包括自愿表达情绪和维护信任。","model":"“刚才我有点着急，语气可能偏硬。抱歉，我们可以继续聊。”","principle":"边界不是冷漠"},{"id":"RA-046","group":"幽默与软边界","signal":"幽默与边界","scene":"办公室轻松闲聊，熟悉的同事开玩笑","question":"你是不是跟领导关系特别好？","options":["详细解释所有私人接触","语气轻松地说“哪有神通广大，我连会议室都得预约。你想问哪项工作？”","反问“你是不是在监视我？”","编造自己从不和领导交流"],"correct":1,"rationale":"在关系友好、无保密压力时，轻微自嘲加回到具体事务可以既保留边界又不冷场。幽默不是唯一答案。","model":"“没什么特别关系啦。你是有哪项工作需要协调吗？”","principle":"幽默可选，先看场合"},{"id":"RA-047","group":"幽默与软边界","signal":"幽默与边界","scene":"茶水间闲聊，不涉及薪酬披露义务","question":"你月薪到底多少啊？","options":["把全部工资奖金福利解释一遍","谎报数字","轻松说“这份个人财报暂不公开，哈哈”并停止","指责对方目的不纯"],"correct":2,"rationale":"私人薪酬可以不谈。幽默适合熟人轻松场合，严肃或重复逼问时应更明确设置边界。","model":"“这个就让我保留点隐私吧。”","principle":"轻松拒绝，笑完也不继续交代"},{"id":"RA-048","group":"幽默与软边界","signal":"幽默禁区","scene":"有人询问尚未公开的人事安排","question":"你知道下一批人员调整名单吗？","options":["用幽默暗示你掌握内部消息","按授权边界说明无法提供未公开信息，并指向正式渠道","先讲听到的传闻，再说仅供参考","反讽对方多管闲事"],"correct":1,"rationale":"涉未公开信息不宜使用容易误导的玩笑。先保护保密要求与事实准确性。","model":"“如果尚未正式公布，我不能确认或分享名单，请以正式通知为准。”","principle":"保密与真实性优先于机智"},{"id":"RA-049","group":"幽默与软边界","signal":"幽默禁区","scene":"学生焦急寻求即时医疗帮助","question":"我现在很难受，你们还要问这么多吗？","options":["用幽默缓和“别急，医生也怕排队”","先判断严重程度，给出必要的安全指引并说明为什么需要关键事实","转移话题聊自己过去生病经历","不回应，等待对方平静"],"correct":1,"rationale":"紧急求助应优先保障安全、澄清紧急症状并给出可行动的指引。幽默可能被理解为轻视。","model":"“我理解你很着急。为了尽快安排正确帮助，我先确认有没有需要立即就医的严重症状。”","principle":"高风险场景：清晰与共情优先"},{"id":"RA-050","group":"幽默与软边界","signal":"幽默与边界","scene":"熟人注意到你今天话少","question":"你今天怎么突然这么安静？","options":["列举最近各种心理状态","用轻松自嘲回应“练习少说两句，刚开始见效”，不再过度解释","认为这是刻意试探并反问","拒绝一切交流"],"correct":1,"rationale":"这种普通社交问题不需要防御式分析。轻松玩笑可以自然化解，也可直接回答。","model":"“我在练习少说两句，效果看来不错。”","principle":"正常闲聊：允许自然幽默"},{"id":"RA-051","group":"幽默与软边界","signal":"幽默禁区","scene":"正式会议，主管追问已经到期的任务","question":"这项工作为什么还没有完成？","options":["用自嘲玩笑拖延说明","给出核实后的原因、风险、补救和完成节点","反问主管为什么不相信自己","绕开问题讲完整工作史"],"correct":1,"rationale":"真实工作问责需要直接承担应承担的责任并给出下一步，幽默不能替代实质回应。","model":"“任务未完成主要是测试仍有问题。我负责今天完成复核，预计明天下午提交，并在有变动时及时报告。”","principle":"职责问题：事实、责任、行动"},{"id":"RA-052","group":"幽默与软边界","signal":"幽默与边界","scene":"熟悉的朋友开玩笑说你老爱提前知道事情","question":"你是有内部情报渠道吧？","options":["顺着玩笑承认自己能获取机密","笑着说“我要真有情报渠道，先查查明天会不会下雨；工作上的消息还是看正式通知”","长篇复述所有接触过的同事","立即指责对方恶意"],"correct":1,"rationale":"轻微玩笑可以友善回应，但不要用幽默暗示自己有不应获得的信息。","model":"“没有啦，正式消息还是看通知比较准。”","principle":"幽默不能制造虚假的知情暗示"},{"id":"RA-053","group":"幽默与软边界","signal":"幽默禁区","scene":"同事对第三个人的能力做负面评价并要你附和","question":"他是不是很不靠谱，你也这样觉得吧？","options":["拿对方短处开玩笑来活跃气氛","转到具体协作事实，不对人做泛化评价","迎合对方并补充负面传闻","用嘲笑提出问题的人来反制"],"correct":1,"rationale":"拿第三人当笑点会放大人际风险。讨论具体任务表现，保持尊重和准确。","model":"“如果是项目协作问题，我们可以讨论具体事项。我不太想给人贴标签。”","principle":"不拿第三人作笑料"}]</script><script id="dialogue-bank" type="application/json">[{"id":"DL-01","title":"突然提起与领导的关系","tags":["预设","幽默","工作边界"],"context":"你和熟悉的同事在讨论排班，气氛轻松。他突然转话题。","start":"start","nodes":{"start":{"line":"你是不是和某位领导特别熟？有些消息应该早就知道吧？","options":[{"text":"“没有没有，我可以给你讲讲我们平时怎么联系……”","score":0,"next":"over","reason":"自动进入自证，可能不必要地披露私人交往。"},{"text":"“怎么突然问这个？你是想了解哪项工作？”","score":2,"next":"clear","reason":"先澄清目的，不接受“应该知道”的预设。"},{"text":"“我哪有那么神通广大，连会议室都得预约。你想问哪件事？”","score":2,"next":"light","reason":"关系轻松时可幽默化解，同时回到具体需求。"}],"tip":""},"over":{"line":"哦，所以你确实跟他私下聊过？那你肯定知道人员调整名单吧？","options":[{"text":"“具体往来不谈了，未公开安排也不能猜。你要确认哪项正式信息？”","score":2,"next":"finish_info","reason":"及时止损：纠正边界，不继续自证。"},{"text":"“我只是偶尔联系……名单我猜是……”","score":0,"next":"finish_sensitive","reason":"进一步披露且扩散未经确认的信息。"},{"text":"“你干嘛这样问？你在套话吧！”","score":1,"next":"finish_tension","reason":"可划界，但动机未明时直接指责不一定必要。"}],"tip":""},"clear":{"line":"其实我想问下周值班安排是谁批准的，能不能帮忙找负责人确认？","options":[{"text":"“这是具体工作事项，我可以帮你查公开流程或联系负责部门。”","score":2,"next":"finish_work","reason":"从模糊试探转为职责内合理请求，应适度提供协助。"},{"text":"“你刚才那样问，我现在不想理你。”","score":0,"next":"finish_tension","reason":"对方已澄清正常目的，不宜继续一概防备。"},{"text":"“你去找领导，别问我。”","
