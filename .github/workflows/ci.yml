name: offline-checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify packaged checksums
        run: sha256sum -c SHA256SUMS.txt
      - name: Core checks (scheduler, migration, validation, banks)
        run: node tests/core.cjs
      - name: Storage and rollback semantics
        run: node tests/regression.cjs
      - name: Rebuild is byte-identical to the committed single file
        run: |
          python rebuild.py
          git diff --exit-code -- index.html
